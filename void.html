<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Искрит серебром</title>
    <link rel="icon" type="image/png" href="assets/images/фавиконка.png">
    <link rel="stylesheet" href="void.css">
</head>
<body>
    <div class="void-cursor" id="voidCursor"></div>

    <div class="void-vignette" aria-hidden="true"></div>
    <div class="void-scanlines" aria-hidden="true"></div>

    <div class="void-frame" aria-hidden="true">
        <span class="void-frame-corner tl"></span>
        <span class="void-frame-corner tr"></span>
        <span class="void-frame-corner bl"></span>
        <span class="void-frame-corner br"></span>
    </div>

    <div class="void-controls">
        <button type="button" class="void-btn active" id="soundToggle">♪ on</button>
        <button type="button" class="void-btn lang-btn active" data-lang="ru">ru</button>
        <button type="button" class="void-btn lang-btn" data-lang="eng">eng</button>
    </div>

    <div class="void-side void-side-left" aria-hidden="true">◆ ─ ◆ ─ ◆ ─ ◆ ─ ◆ ─ ◆ ─ ◆ ─ ◆</div>
    <div class="void-side void-side-right" aria-hidden="true">◇ ─ ◇ ─ ◇ ─ ◇ ─ ◇ ─ ◇ ─ ◇ ─ ◇</div>

    <article class="void-article" id="voidArticle"></article>

    <script src="void.js"></script>
</body>
</html>
