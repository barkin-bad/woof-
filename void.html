<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>woof!</title>
    <link rel="icon" type="image/png" href="assets/images/фавиконка.png">
    <link rel="stylesheet" href="void.css">
</head>
<body>
    <div class="void-cursor" id="voidCursor"></div>

    <div class="void-controls">
        <button type="button" class="ctrl-btn" id="soundBtn">♪</button>
        <button type="button" class="ctrl-btn lang-btn active" data-lang="ru">ru</button>
        <button type="button" class="ctrl-btn lang-btn" data-lang="eng">eng</button>
    </div>

    <article class="void-article">
        <h1 class="void-title" id="voidTitle"></h1>

        <p class="void-p" data-index="0"></p>
        <figure class="void-figure void-figure-full">
            <img src="https://i.pinimg.com/736x/ee/35/1c/ee351ce8ad95f60c8c19fc2c1d4c15e1.jpg" alt="">
        </figure>

        <p class="void-p" data-index="1"></p>
        <figure class="void-figure void-figure-right">
            <img src="https://i.pinimg.com/736x/95/98/cd/9598cd6b70c723a776a2248c926de61b.jpg" alt="">
        </figure>

        <p class="void-p" data-index="2"></p>
        <p class="void-p" data-index="3"></p>

        <figure class="void-figure void-figure-left">
            <img src="https://i.pinimg.com/736x/a4/ea/e4/a4eae4326c8ce481a3d37ff79ed6b821.jpg" alt="">
        </figure>

        <p class="void-p" data-index="4"></p>
        <figure class="void-figure void-figure-full">
            <img src="https://i.pinimg.com/736x/6e/8c/6c/6e8c6c362b2748aec0cbe2c668d9090e.jpg" alt="">
        </figure>

        <p class="void-p" data-index="5"></p>
    </article>

    <script src="void.js"></script>
</body>
</html>
